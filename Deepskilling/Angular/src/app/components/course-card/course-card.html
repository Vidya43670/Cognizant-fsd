<div class="card">

<h3>{{course.name}}</h3>

<p>
Code: {{course.code}}
</p>

<p>
Credits: {{course.credits}}
</p>

<p>
Status: {{course.gradeStatus}}
</p>


<button (click)="toggleEnroll()">

{{ enrolled ? 'Unenroll' : 'Enroll' }}

</button>
<button [routerLink]="['/course-detail', course.id]">
  View Details
</button>


</div>
