<h1>Available Courses</h1>


<div class="course-container">

<div class="course-card" *ngFor="let course of courses">

<h2>{{course.name}}</h2>

<p>
<b>Instructor:</b>
{{course.instructor}}
</p>

<p>
<b>Duration:</b>
{{course.duration}}
</p>


<p>
<b>Credits:</b>
{{course.credits}}
</p>


<a [routerLink]="['/course',course.id]">
View Details
</a>


</div>

</div>
