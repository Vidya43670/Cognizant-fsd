<h2>Available Courses</h2>


<div *ngFor="let course of courses">


<h3>
{{course.name}}
</h3>


<p>
Code: {{course.code}}
</p>


<p>
Credits: {{course.credits}}
</p>


<p>
Status: {{course.gradeStatus}}
</p>


<a [routerLink]="['/course-detail',course.id]">

<button>
View Details
</button>

</a>


<hr>


</div>
